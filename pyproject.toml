[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "opensup"
version = "1.0.0"
description = "Professional-grade PGS subtitle encoder for Blu-ray"
readme = "README.md"
authors = [{name = "cubicibo"}]
license = {text = "GPL-3.0"}
requires-python = ">=3.11"
dependencies = [
    "Pillow",
    "numpy>=1.24.0",
    "opencv-python",
    "piliq",
    "SSIM-PIL",
    "timecode",
    "psutil; sys_platform == 'win32'",
    "customtkinter",
    "tqdm",
]

[project.urls]
Homepage = "https://github.com/cubicibo/SUPer"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pyright]
extraPaths = ["src"]

