<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>OpenSUP</title>
</head>
<body>
<div id="app">

  <!-- ── Header (Qt replica: vLines + brand stack + control combos) ── -->
  <header class="header">
    <div class="vline"></div>
    <div class="brand">
      <div class="brand-top-line"></div>
      <img id="logo" alt="OpenSUP" src="./src/assets/images/logo.png" />
      <span class="subtitle" data-i18n="subtitle">PGS Subtitle Encoder</span>
      <div class="brand-bottom-line"></div>
    </div>
    <div class="vline"></div>
    <div class="header-controls">
      <div class="dropdown hdr-dd" id="dd_language" title="Interface Language / Idioma de interfaz">
        <button type="button" class="dd-btn" aria-haspopup="listbox" aria-expanded="false">
          <img class="dd-flag dd-flag-current" alt="" src="./src/assets/flags/us.svg"/>
          <span class="dd-label">English (US)</span>
        </button>
        <ul class="dd-list" role="listbox">
          <li role="option" data-val="0"><img class="dd-flag" alt="" src="./src/assets/flags/us.svg"/><span>English (US)</span></li>
          <li role="option" data-val="1"><img class="dd-flag" alt="" src="./src/assets/flags/es.svg"/><span>Spanish</span></li>
        </ul>
        <select id="cmb_language" class="seg-source" aria-hidden="true" tabindex="-1">
          <option value="0">English (US)</option>
          <option value="1">Spanish</option>
        </select>
      </div>

      <div class="dropdown hdr-dd" id="dd_theme" title="Theme / Tema">
        <button type="button" class="dd-btn" aria-haspopup="listbox" aria-expanded="false">
          <span class="dd-label">System</span>
        </button>
        <ul class="dd-list" role="listbox">
          <li role="option" data-val="0"><span data-i18n="themeSystem">System</span></li>
          <li role="option" data-val="1"><span data-i18n="themeLight">Light</span></li>
          <li role="option" data-val="2"><span data-i18n="themeDark">Dark</span></li>
        </ul>
        <select id="cmb_theme" class="seg-source" aria-hidden="true" tabindex="-1">
          <option value="0">System</option>
          <option value="1">Light</option>
          <option value="2">Dark</option>
        </select>
      </div>
    </div>
  </header>

  <!-- ── Content splitter (Qt replica: config left, monitoring right) ── -->
  <div class="main-grid">

    <!-- ── Left column: config container (~400px) ── -->
    <section class="controls">

      <div class="controls-scroll">

      <!-- Project Scope -->
      <div class="card">
        <h2 class="card-title" data-i18n="projectScope">Project Scope</h2>
        <div class="drop-zone" data-drop="bdn" title="Drag & drop a BDN XML file here">
          <button id="btn_select_bdn" class="btn btn-secondary" data-i18n="selectBdn">Select BDN XML</button>
          <span id="lbl_bdn_file" class="file-label" data-i18n="noFile">No file selected</span>
        </div>
        <div class="output-row">
          <button id="btn_set_output" class="btn btn-secondary" data-i18n="setOutput">Set SUP Output</button>
        </div>
        <span class="output-file-row">
          <span id="lbl_output_file" class="file-label" data-i18n="destNotSet">Destination not set</span>
          <button id="btn_reveal_output" class="btn btn-icon" disabled title="Open output folder" aria-label="Open output folder">
            <span class="seg-icon" data-icon="folder" aria-hidden="true"></span>
          </button>
        </span>
      </div>

      <!-- Parameters -->
      <div class="card">
        <h2 class="card-title" data-i18n="parameters">Parameters</h2>
        <div class="param-row">
          <label for="combo_quantizer" class="param-label" data-i18n="quantizer">Quantizer</label>
          <div class="dropdown" id="dd_quantizer">
            <button type="button" class="dd-btn">libimagequant</button>
            <ul class="dd-list" role="listbox">
              <li role="option" data-val="0" title="libimagequant (best, fast)"><span>libimagequant (best, fast)</span></li>
              <li role="option" data-val="1" title="HexTree (good, very fast)"><span>HexTree (good, very fast)</span></li>
            </ul>
            <select id="combo_quantizer" class="seg-source">
              <option value="0">libimagequant</option>
              <option value="1">HexTree</option>
            </select>
          </div>
        </div>
        <div class="param-row">
          <label for="combo_colorspace" class="param-label" data-i18n="colorSpace">Color Space</label>
          <select id="combo_colorspace">
            <option value="bt709">BT.709</option>
            <option value="bt601">BT.601</option>
            <option value="bt2020">BT.2020</option>
          </select>
        </div>
        <div class="param-row">
          <label for="input_redraw" class="param-label" data-i18n="redrawPeriod">Anchor interval</label>
          <span class="redraw-group">
            <input id="input_redraw" class="input-num" type="number" min="0" step="0.1" value="0" title="Insert anchors at the given interval to let decoders catch-up on long-lasting events. 0: disabled. Minimum: 1 second."/>
            <span class="help-tip" tabindex="0" data-i18n="redrawPeriodTip"></span>
          </span>
        </div>
        <div class="param-row">
          <label for="input_max_kbps" class="param-label" data-i18n="maxKbps">Max bitrate</label>
          <span class="redraw-group">
            <input id="input_max_kbps" class="input-num" type="number" min="0" max="48000" step="100" value="0" title="Validate the output against a max stream bitrate in Kbps. 0: disabled."/>
            <span class="help-tip" tabindex="0" data-i18n="maxKbpsTip"></span>
          </span>
        </div>
        <div class="param-row">
          <label for="input_threads" class="param-label" data-i18n="threads">Threads</label>
          <span class="redraw-group">
            <input id="input_threads" class="input-num" type="number" min="0" max="1024" step="1" value="1" title="Parallel epoch encoding workers. 0: auto (hardware), 1: sequential."/>
            <span class="help-tip" tabindex="0" data-i18n="threadsTip"></span>
          </span>
        </div>
        <div class="param-row">
          <label for="input_compression" class="param-label" data-i18n="compression">Compression</label>
          <span class="redraw-group">
            <input id="input_compression" class="input-num" type="number" min="0" max="100" step="1" value="80" title="Quality factor: 0 forces all acquisitions (no compression), 100 = maximum compression."/>
            <span class="help-tip" tabindex="0" data-i18n="compressionTip"></span>
          </span>
        </div>
        <div class="param-row">
          <label for="input_acqrate" class="param-label" data-i18n="acqrate">Acq. Rate</label>
          <span class="redraw-group">
            <input id="input_acqrate" class="input-num" type="number" min="0" max="100" step="1" value="100" title="Drought scaling factor: controls how fast drought accumulates between acquisitions."/>
            <span class="help-tip" tabindex="0" data-i18n="acqrateTip"></span>
          </span>
        </div>
        <div class="param-row">
          <label for="input_ssim_tol" class="param-label" data-i18n="ssimTol">SSIM Tol.</label>
          <span class="redraw-group">
            <input id="input_ssim_tol" class="input-num" type="number" min="-100" max="100" step="1" value="0" title="SSIM tolerance: adjusts similarity threshold per resolution. Negative = stricter, positive = more lenient."/>
            <span class="help-tip" tabindex="0" data-i18n="ssimTolTip"></span>
          </span>
        </div>
        <div class="param-row">
          <label for="input_extra_acq" class="param-label" data-i18n="extraAcq">Extra Acq</label>
          <span class="redraw-group">
            <input id="input_extra_acq" class="input-num" type="number" min="0" max="100" step="1" value="2" title="Force acquisition after N palette updates without one. 0 = disabled."/>
            <span class="help-tip" tabindex="0" data-i18n="extraAcqTip"></span>
          </span>
        </div>
      </div>

      <!-- Engine Options -->
      <div class="card">
        <h2 class="card-title" data-i18n="engineOpts">Engine Options</h2>
        <div class="check-list">
          <label class="check">
            <input type="checkbox" id="chk_allow_normal"/>
            <span data-i18n="allowNormal">Allow normal case object redefinition.</span>
          </label>
          <label class="check">
            <input type="checkbox" id="chk_prefer_normal"/>
            <span data-i18n="preferNormal">Prefer normal case object redefinition.</span>
          </label>
          <label class="check">
            <input type="checkbox" id="chk_overlap"/>
            <span data-i18n="overlapBuf">Allow palette update buffering.</span>
          </label>
          <label class="check">
            <input type="checkbox" id="chk_full_palette"/>
            <span data-i18n="fullPalette">Write full palette.</span>
          </label>
          <label class="check">
            <input type="checkbox" id="chk_both_formats"/>
            <span data-i18n="bothFormats">Generate both SUP and PES+MUI files.</span>
          </label>
          <label class="check">
            <input type="checkbox" id="chk_ignore_res"/>
            <span data-i18n="ignoreRes">Ignore Resolution Validation (Experimental)</span>
          </label>
        </div>
      </div>

      </div><!-- /controls-scroll -->
    </section>

    <!-- ── Right column: monitoring panel (log + progress + actions) ── -->
    <section class="log-panel">

      <div class="log-card">
        <div class="log-header">
          <span class="log-title" data-i18n="activityLog">ACTIVITY LOG</span>
          <span id="lbl_log_lines" class="log-count">[0 lines]</span>
          <div class="log-buttons">
            <button id="btn_copy_log" class="btn btn-ghost" data-i18n="copy">Copy</button>
            <button id="btn_clear_log" class="btn btn-ghost" data-i18n="clear">Clear</button>
          </div>
        </div>
        <div id="txt_log" class="log-area" data-empty="No activity yet. Select a file and press ENCODE to begin.">
        </div>
      </div>

      <!-- Progress group -->
      <div class="card card-progress">
        <h2 class="card-title" data-i18n="progress">Progress</h2>
        <div class="progress-info">
          <span id="status_led" class="led led-standing" role="status" aria-live="polite"></span>
          <span id="lbl_progress_text" data-i18n="standingBy">Standing by</span>
          <span id="lbl_pct" class="pct">0%</span>
          <span id="lbl_eta" class="eta">—</span>
        </div>
        <div class="progress-track">
          <div class="progress-border-overlay"></div>
          <div class="progress-gradient-overlay"></div>
          <div id="progress_fill" class="progress-fill"></div>
        </div>
      </div>

      <!-- Action row -->
      <div class="encode-row">
        <button id="btn_encode" class="btn btn-primary" data-i18n="initEncode" disabled>ENCODE</button>
        <button id="btn_abort" class="btn btn-danger" data-i18n="abort" disabled>ABORT</button>
      </div>

    </section>
  </div>
</div>
<script src="./src/app.js" type="module"></script>
</body>
</html>
