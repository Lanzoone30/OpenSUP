    <section class="controls">

      <div class="controls-scroll">

      <!-- Project Scope -->
      <div class="card">
        <div class="card-head">
          <h2 class="card-title" data-i18n="projectScope">Project Scope</h2>
          <button id="btn_clear_scope" class="btn btn-icon" disabled title="Clear selections" aria-label="Clear selections">
            <span class="seg-icon" data-icon="eraser" aria-hidden="true"></span>
          </button>
        </div>
        <div id="drop_bdn" class="drop-zone" data-drop="bdn">
          <button id="btn_select_bdn" class="btn btn-secondary" data-i18n="selectBdn">Select BDN XML file</button>
          <span id="lbl_bdn_file" class="file-label" data-i18n="noFile">No file selected</span>
        </div>
        <div class="output-row">
          <button id="btn_set_output" class="btn btn-secondary" data-i18n="setOutput">Set SUP output</button>
        </div>
        <span class="output-file-row">
          <span id="lbl_output_file" class="file-label" data-i18n="destNotSet">Destination not set</span>
          <button id="btn_reveal_output" class="btn btn-icon" disabled title="Open output folder" aria-label="Open output folder">
            <span class="seg-icon" data-icon="folder" aria-hidden="true"></span>
          </button>
        </span>
        <div id="encode_hint" class="encode-hint" hidden>
          <span id="hint_bdn" class="hint-chip"><span data-i18n="reqBdn">BDN file</span></span>
          <span id="hint_output" class="hint-chip"><span data-i18n="reqSupOutput">SUP output</span></span>
        </div>
      </div>

      <!-- Parameters -->
      <details class="card" id="dd_params" open>
        <summary class="card-title" data-i18n="parameters">Parameters</summary>
        <div class="param-row">
          <label for="btn_quantizer" class="param-label" id="lbl_quantizer" data-i18n="quantizer">Quantizer</label>
          <div class="dropdown" id="dd_quantizer">
            <button type="button" class="dd-btn" id="btn_quantizer" role="combobox" aria-haspopup="listbox" aria-expanded="false" aria-controls="dd_quantizer_list" aria-labelledby="lbl_quantizer">libimage (best, fast)</button>
            <ul class="dd-list" id="dd_quantizer_list" role="listbox" aria-labelledby="lbl_quantizer">
              <li role="option" data-val="2" title="libimage (best, fast)"><span data-i18n="quantPiliq">libimage (best, fast)</span></li>
              <li role="option" data-val="1" title="HexTree (good, very fast)"><span data-i18n="quantHexTree">HexTree (good, very fast)</span></li>
              <li role="option" data-val="0" title="Qtzr (high quality, fast)"><span data-i18n="quantQtzr">Qtzr (high quality, fast)</span></li>
              <li role="option" data-val="3" title="Wu (variance-optimal)"><span data-i18n="quantWu">Wu (variance-optimal)</span></li>
            </ul>
            <select id="combo_quantizer" class="seg-source">
              <option value="2" selected>libimage</option>
              <option value="1">HexTree</option>
              <option value="0">Qtzr</option>
              <option value="3">Wu</option>
            </select>
          </div>
        </div>
        <div class="param-row param-row-gap">
          <label for="combo_colorspace" class="param-label" data-i18n="colorSpace">Color space</label>
          <select id="combo_colorspace">
            <option value="bt709">BT.709</option>
            <option value="bt601">BT.601</option>
            <option value="bt2020">BT.2020</option>
          </select>
        </div>
        <details class="adv" id="dd_advanced">
        <summary class="adv-title" data-i18n="advancedOptions">Advanced Options</summary>
        <div class="param-row">
          <label for="combo_threads" class="param-label" data-i18n="threads">Threads</label>
          <span class="redraw-group">
            <select id="combo_threads">
              <option value="0" data-i18n="auto">Auto</option>
              <option value="1">1</option>
            </select>
            <span class="help-tip" tabindex="0" data-i18n="threadsTip"></span>
          </span>
        </div>
        <div class="param-row">
          <label for="input_redraw" class="param-label" data-i18n="redrawPeriod">Redraw period</label>
          <span class="redraw-group">
            <input id="input_redraw" class="input-num" type="number" min="0" step="0.1" value="0"/>
            <span class="help-tip" tabindex="0" data-i18n="redrawPeriodTip"></span>
          </span>
        </div>
        <div class="param-row">
          <label for="input_max_kbps" class="param-label" data-i18n="maxKbps">Max bitrate</label>
          <span class="redraw-group">
            <input id="input_max_kbps" class="input-num" type="number" min="0" max="48000" step="100" value="0"/>
            <span class="help-tip" tabindex="0" data-i18n="maxKbpsTip"></span>
          </span>
        </div>
        <div class="param-row">
          <label for="input_compression" class="param-label" data-i18n="compression">Compression</label>
          <span class="redraw-group">
            <input id="input_compression" class="input-num" type="number" min="0" max="100" step="1" value="80"/>
            <span class="help-tip" tabindex="0" data-i18n="compressionTip"></span>
          </span>
        </div>
        <div class="param-row">
          <label for="input_acqrate" class="param-label" data-i18n="acqrate">Acquisition rate</label>
          <span class="redraw-group">
            <input id="input_acqrate" class="input-num" type="number" min="0" max="100" step="1" value="100"/>
            <span class="help-tip" tabindex="0" data-i18n="acqrateTip"></span>
          </span>
        </div>
        <div class="param-row">
          <label for="input_ssim_tol" class="param-label" data-i18n="ssimTol">SSIM tolerance</label>
          <span class="redraw-group">
            <input id="input_ssim_tol" class="input-num" type="number" min="-100" max="100" step="1" value="0"/>
            <span class="help-tip" tabindex="0" data-i18n="ssimTolTip"></span>
          </span>
        </div>
        <div class="param-row">
          <label for="input_extra_acq" class="param-label" data-i18n="extraAcq">Extra acquisition</label>
          <span class="redraw-group">
            <input id="input_extra_acq" class="input-num" type="number" min="0" max="100" step="1" value="2"/>
            <span class="help-tip" tabindex="0" data-i18n="extraAcqTip"></span>
          </span>
        </div>
        </details>
      </details>

      <!-- Engine Options -->
      <details class="card" id="dd_engine" open>
        <summary class="card-title" data-i18n="engineOpts">Engine Options</summary>
        <div class="check-list">
          <label class="check">
            <input type="checkbox" id="chk_allow_normal"/>
            <span class="check-text"><span data-i18n="allowNormal" data-i18n-tip="tipAllowNormal">Allow normal case object redefinition.</span></span>
          </label>
          <label class="check">
            <input type="checkbox" id="chk_prefer_normal"/>
            <span class="check-text"><span data-i18n="preferNormal" data-i18n-tip="tipPreferNormal">Prefer normal case object redefinition.</span></span>
          </label>
          <label class="check">
            <input type="checkbox" id="chk_overlap"/>
            <span class="check-text"><span data-i18n="overlapBuf" data-i18n-tip="tipOverlapBuf">Allow palette update buffering.</span></span>
          </label>
          <label class="check">
            <input type="checkbox" id="chk_full_palette"/>
            <span class="check-text"><span data-i18n="fullPalette" data-i18n-tip="tipFullPalette">Write full palette.</span></span>
          </label>
          <label class="check">
            <input type="checkbox" id="chk_tight_ods"/>
            <span class="check-text"><span data-i18n="tightOds" data-i18n-tip="tipTightOds">Fit ODS box to text</span></span>
          </label>
          <label class="check">
            <input type="checkbox" id="chk_single_object_ds"/>
            <span class="check-text"><span data-i18n="singleObjectDs" data-i18n-tip="tipSingleObjectDs">One object per display set (Android TV compatibility)</span></span>
          </label>
          <label class="check">
            <input type="checkbox" id="chk_alternate_oids"/>
            <span class="check-text"><span data-i18n="alternateOids" data-i18n-tip="tipAlternateOids">Use global object IDs 0/1 (interoperability)</span></span>
          </label>
          <label class="check">
            <input type="checkbox" id="chk_both_formats"/>
            <span class="check-text"><span data-i18n="bothFormats" data-i18n-tip="tipBothFormats">Generate both SUP and PES+MUI output.</span></span>
          </label>
          <label class="check">
            <input type="checkbox" id="chk_ignore_resolution"/>
            <span class="check-text"><span data-i18n="ignoreResolution" data-i18n-tip="tipIgnoreResolution">Ignore resolution validation.</span></span>
          </label>
        </div>
      </details>

      </div><!-- /controls-scroll -->
    </section>
