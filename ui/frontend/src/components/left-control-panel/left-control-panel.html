    <section class="controls">

      <div class="controls-scroll">

      <!-- Project Scope -->
      <div class="card">
        <h2 class="card-title" data-i18n="projectScope">Project Scope</h2>
        <div class="drop-zone" data-drop="bdn" title="Drag & drop a BDN XML file here">
          <button id="btn_select_bdn" class="btn btn-secondary" data-i18n="selectBdn">Select BDN XML</button>
          <span id="lbl_bdn_file" class="file-label" data-i18n="noFile">No file selected</span>
        </div>
        <div class="output-row">
          <button id="btn_set_output" class="btn btn-secondary" data-i18n="setOutput">Set SUP Output</button>
        </div>
        <span class="output-file-row">
          <span id="lbl_output_file" class="file-label" data-i18n="destNotSet">Destination not set</span>
          <button id="btn_reveal_output" class="btn btn-icon" disabled title="Open output folder" aria-label="Open output folder">
            <span class="seg-icon" data-icon="folder" aria-hidden="true"></span>
          </button>
        </span>
      </div>

      <!-- Parameters -->
      <details class="card" id="dd_params" open>
        <summary class="card-title" data-i18n="parameters">Parameters</summary>
        <div class="param-row">
          <label for="combo_quantizer" class="param-label" data-i18n="quantizer">Quantizer</label>
          <div class="dropdown" id="dd_quantizer">
            <button type="button" class="dd-btn">libimagequant</button>
            <ul class="dd-list" role="listbox">
              <li role="option" data-val="0" title="libimagequant (best, fast)"><span>libimagequant (best, fast)</span></li>
              <li role="option" data-val="1" title="HexTree (good, very fast)"><span>HexTree (good, very fast)</span></li>
            </ul>
            <select id="combo_quantizer" class="seg-source">
              <option value="0">libimagequant</option>
              <option value="1">HexTree</option>
            </select>
          </div>
        </div>
        <div class="param-row param-row-gap">
          <label for="combo_colorspace" class="param-label" data-i18n="colorSpace">Color Space</label>
          <select id="combo_colorspace">
            <option value="bt709">BT.709</option>
            <option value="bt601">BT.601</option>
            <option value="bt2020">BT.2020</option>
          </select>
        </div>
        <details class="adv" id="dd_advanced">
        <summary class="adv-title" data-i18n="advancedOptions">Advanced Options</summary>
        <div class="param-row">
          <label for="combo_threads" class="param-label" data-i18n="threads">Threads</label>
          <span class="redraw-group">
            <select id="combo_threads">
              <option value="0" data-i18n="auto">Auto</option>
              <option value="1">1</option>
            </select>
            <span class="help-tip" tabindex="0" data-i18n="threadsTip"></span>
          </span>
        </div>
        <div class="param-row">
          <label for="input_redraw" class="param-label" data-i18n="redrawPeriod">Anchor interval</label>
          <span class="redraw-group">
            <input id="input_redraw" class="input-num" type="number" min="0" step="0.1" value="0"/>
            <span class="help-tip" tabindex="0" data-i18n="redrawPeriodTip"></span>
          </span>
        </div>
        <div class="param-row">
          <label for="input_max_kbps" class="param-label" data-i18n="maxKbps">Max bitrate</label>
          <span class="redraw-group">
            <input id="input_max_kbps" class="input-num" type="number" min="0" max="48000" step="100" value="0"/>
            <span class="help-tip" tabindex="0" data-i18n="maxKbpsTip"></span>
          </span>
        </div>
        <div class="param-row">
          <label for="input_compression" class="param-label" data-i18n="compression">Compression</label>
          <span class="redraw-group">
            <input id="input_compression" class="input-num" type="number" min="0" max="100" step="1" value="80"/>
            <span class="help-tip" tabindex="0" data-i18n="compressionTip"></span>
          </span>
        </div>
        <div class="param-row">
          <label for="input_acqrate" class="param-label" data-i18n="acqrate">Acq. Rate</label>
          <span class="redraw-group">
            <input id="input_acqrate" class="input-num" type="number" min="0" max="100" step="1" value="100"/>
            <span class="help-tip" tabindex="0" data-i18n="acqrateTip"></span>
          </span>
        </div>
        <div class="param-row">
          <label for="input_ssim_tol" class="param-label" data-i18n="ssimTol">SSIM Tol.</label>
          <span class="redraw-group">
            <input id="input_ssim_tol" class="input-num" type="number" min="-100" max="100" step="1" value="0"/>
            <span class="help-tip" tabindex="0" data-i18n="ssimTolTip"></span>
          </span>
        </div>
        <div class="param-row">
          <label for="input_extra_acq" class="param-label" data-i18n="extraAcq">Extra Acq</label>
          <span class="redraw-group">
            <input id="input_extra_acq" class="input-num" type="number" min="0" max="100" step="1" value="2"/>
            <span class="help-tip" tabindex="0" data-i18n="extraAcqTip"></span>
          </span>
        </div>
        </details>
      </details>

      <!-- Engine Options -->
      <details class="card" id="dd_engine" open>
        <summary class="card-title" data-i18n="engineOpts">Engine Options</summary>
        <div class="check-list">
          <label class="check">
            <input type="checkbox" id="chk_allow_normal"/>
            <span data-i18n="allowNormal">Allow normal case object redefinition.</span>
          </label>
          <label class="check">
            <input type="checkbox" id="chk_prefer_normal"/>
            <span data-i18n="preferNormal">Prefer normal case object redefinition.</span>
          </label>
          <label class="check">
            <input type="checkbox" id="chk_overlap"/>
            <span data-i18n="overlapBuf">Allow palette update buffering.</span>
          </label>
          <label class="check">
            <input type="checkbox" id="chk_full_palette"/>
            <span data-i18n="fullPalette">Write full palette.</span>
          </label>
          <label class="check">
            <input type="checkbox" id="chk_alternate_oids"/>
            <span data-i18n="alternateOids">Alternate per-window object ids (multi-window).</span>
          </label>
          <label class="check">
            <input type="checkbox" id="chk_both_formats"/>
            <span data-i18n="bothFormats">Generate both SUP and PES+MUI files.</span>
          </label>
          <label class="check">
            <input type="checkbox" id="chk_ignore_res"/>
            <span data-i18n="ignoreRes">Ignore Resolution Validation</span>
          </label>
        </div>
      </details>

      </div><!-- /controls-scroll -->
    </section>
